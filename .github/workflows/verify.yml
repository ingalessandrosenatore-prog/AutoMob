name: AutoMob quality gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "tool/verify.ps1")
          }

          if ($projects.Count -eq 0) {
            Write-Host "STOP: nessun tool/verify.ps1 trovato nelle cartelle progetto." -ForegroundColor Red
            exit 1
          }

          foreach ($project in $projects) {
            if (Test-Path (Join-Path $project.FullName "pubspec.yaml")) {
              Write-Host ""
              Write-Host "==> flutter pub get $($project.Name)" -ForegroundColor Cyan
              Push-Location $project.FullName
              try {
                flutter pub get
                if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
                }
              } finally {
                Pop-Location
              }
            }
          }

      - name: Run mandatory quality gates
        shell: pwsh
        env:
          VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $projects = Get-ChildItem -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "tool/verify.ps1")
          }

          foreach ($project in $projects) {
            Write-Host ""
            Write-Host "==> Verifica $($project.Name)" -ForegroundColor Cyan
            Push-Location $project.FullName
            try {
              ./tool/verify.ps1
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            } finally {
              Pop-Location
            }
          }
