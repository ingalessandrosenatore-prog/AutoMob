<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoMob · Personaggio animato</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141b;color:#eef0f5;font:15px system-ui}
main{height:100vh;display:grid;grid-template-columns:1fr 310px}#stage{min-width:0;background:radial-gradient(ellipse at 50% 60%,#2b3242,#11141b 70%)}
canvas{display:block;width:100%;height:100%}aside{padding:28px 24px;border-left:1px solid #303542;overflow:auto}
h1{font-size:23px;margin:0 0 8px}p{color:#9ea8bc;line-height:1.5}label{display:block;margin:24px 0 8px;font-size:13px;color:#b8c3d9}
select,button,input{width:100%;border:1px solid #42495a;border-radius:10px;padding:10px;background:#202634;color:white;font:inherit}
button{margin-top:12px;cursor:pointer}button.primary{background:#f18836;color:#151515;border-color:#f18836;font-weight:600}input[type=color]{height:43px;padding:4px}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}#status{font-size:12px;overflow-wrap:anywhere}.small{font-size:12px}button:disabled{opacity:.4;cursor:wait}
@media(max-width:650px){main{grid-template-columns:1fr;height:auto}#stage{height:65vh}aside{border:0;padding:20px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<main><div id="stage"></div><aside>
<h1>Il tuo meccanico</h1><p>Modello GLB reale: pose, accessori e colori indipendenti.</p>
<label for="pose">Posizione</label><select id="pose"><option value="standing">In piedi</option><option value="desk">Dietro al banco</option></select>
<label for="prop">Accessorio</label><select id="prop"></select>
<div class="colors"><div><label for="base">Abiti</label><input id="base" type="color" value="#303540"></div><div><label for="accent">Inserti</label><input id="accent" type="color" value="#e76f20"></div></div>
<button id="play" class="primary" disabled>Avvia gesto</button><button id="idle" disabled>Torna in attesa</button>
<label for="time">Esamina il gesto</label><input id="time" type="range" min="0" max="3.99" step="0.01" value="0">
<p id="status">Caricamento del personaggio…</p><p class="small">Trascina per ruotare la vista. La gomma è disponibile solo in piedi.</p>
</aside></main>
<script type="module" src="./viewer.mjs?v=hands-2"></script>
</html>
