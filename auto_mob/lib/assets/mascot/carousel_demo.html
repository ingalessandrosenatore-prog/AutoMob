<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoMob — anteprima profondità</title>
<style>
body{margin:0;background:#090a0d;color:#eee;font:15px system-ui;display:grid;place-items:center;min-height:100vh}
main{width:min(100%,460px)}h2,p{padding:0 22px}h2{font-size:19px}p{color:#aaa;font-size:13px;line-height:1.6}
iframe{width:100%;height:340px;border:0;background:radial-gradient(ellipse at 45% 85%,#35201455,transparent 65%)}
button{background:#26282d;color:white;border:1px solid #555;border-radius:10px;padding:10px 18px}nav{text-align:center}
</style>
<main><h2>OFFICINE COLLEGATE</h2><iframe title="Carosello officine" src="carousel.html"></iframe>
<nav><button id="prev">← Indietro</button> <button id="next">Avanti →</button></nav>
<p>Trascina gli omini: quello al centro avanza, gli altri arretrano. Solo il principale si anima. Nomi e colori sono dimostrativi.</p><p id="selection">AUTO GIORDANO</p></main>
<script>
const frame=document.querySelector('iframe');let index=1;
const items=[
{id:'demo1',name:'Auto Giordano',pose:'desk',prop:'wrench',baseColor:'#252930',accentColor:'#ff7926'},
{id:'demo2',name:'Auto Caruso',pose:'standing',prop:'tablet',baseColor:'#202c43',accentColor:'#3189ff'},
{id:'demo3',name:'Service Martino',pose:'standing',prop:'tire',baseColor:'#21382c',accentColor:'#45bd86'}];
frame.onload=()=>{
frame.contentWindow.WorkshopBridge={postMessage(raw){const message=JSON.parse(raw);if(message.type==='selected')index=message.index;document.querySelector('#selection').textContent=index?items[index-1].name:'Aggiungi officina';}};
frame.contentWindow.setWorkshops({items,selected:index});
};
function move(delta){let position=index===0?items.length:index-1;position=Math.max(0,Math.min(items.length,position+delta));index=position===items.length?0:position+1;frame.contentWindow.selectWorkshop(index);document.querySelector('#selection').textContent=index?items[index-1].name:'Aggiungi officina';}
document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);
</script></html>
