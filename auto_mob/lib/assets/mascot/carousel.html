<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
    #stage{position:absolute;inset:0;touch-action:pan-y}
    #stage canvas{display:block;width:100%;height:100%}
    #overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .label{position:absolute;bottom:5px;left:0;transform:translateX(-50%);white-space:nowrap;color:#c5c5c8;font-size:10px;font-weight:700;text-align:center;text-shadow:0 2px 8px #000;transition:left .32s,opacity .32s,font-size .32s;pointer-events:auto}
    .label.active{color:white;font-size:14px}
    .label{overflow:hidden;text-overflow:ellipsis;transition:font-size .15s}
    #add{position:absolute;bottom:29px;left:0;width:78px;height:126px;transform:translateX(-50%);box-sizing:border-box;border:1px solid #815035;border-radius:15px;background:linear-gradient(145deg,#323030,#121419);box-shadow:0 9px 25px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f78835;pointer-events:auto;transition:left .32s,transform .32s,opacity .32s}
    #add{transition:none}
    #add i{display:grid;place-items:center;width:48px;height:48px;border:2px solid #e56c20;border-radius:50%;font-size:38px;font-style:normal;line-height:1;box-shadow:0 0 18px #e6672180}
    #add span{margin-top:14px;font-size:10px;color:white;font-weight:750}
    #status{position:absolute;inset:0;display:none;place-items:center;color:#ccc;font-size:12px;text-align:center;padding:16px}
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="overlay"><div id="add" role="button" aria-label="Aggiungi officina"><i>+</i><span>AGGIUNGI</span></div></div>
  <div id="status"></div>
  <script src="./carousel.js"></script>
</body>
</html>
